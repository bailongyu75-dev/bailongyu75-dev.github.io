<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我是毛毛他爹</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0a0a12;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(120,80,255,.35), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(0,200,255,.28), transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(255,80,180,.12), transparent 60%);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
    overflow-x:hidden;
  }
  .card{
    position:relative;
    width:100%;max-width:440px;
    padding:48px 32px 40px;
    text-align:center;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.12);
    border-radius:28px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.09);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  .avatar{
    width:104px;height:104px;margin:0 auto 26px;border-radius:50%;
    padding:3px;
    background:linear-gradient(135deg,#7b5cff,#00c8ff);
    box-shadow:0 0 0 1px rgba(255,255,255,.14),0 12px 40px rgba(110,90,255,.45);
    animation:float 4s ease-in-out infinite;
  }
  .avatar img{
    width:100%;height:100%;border-radius:50%;
    object-fit:cover;object-position:50% 30%;
    display:block;background:#0a0a12;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  h1{
    font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.28;
    background:linear-gradient(135deg,#fff 20%,#b9a6ff 60%,#6fe3ff 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    margin-bottom:12px;
  }
  .sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.7;margin-bottom:34px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:11px;
    width:100%;padding:17px 24px;
    font-size:16px;font-weight:650;color:#fff;text-decoration:none;
    background:linear-gradient(135deg,#7b5cff,#4a7dff 55%,#00c8ff);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(90,110,255,.42);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(90,110,255,.6);filter:brightness(1.08)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-ghost{
    margin-top:12px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:none;
    font-weight:600;
  }
  .btn-ghost:hover{background:rgba(255,255,255,.13);box-shadow:0 8px 24px rgba(0,0,0,.3);filter:none}
  .foot{margin-top:26px;font-size:12px;color:rgba(255,255,255,.28);letter-spacing:.4px}
  .foot a{color:rgba(255,255,255,.42);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.18)}
  .foot a:hover{color:rgba(255,255,255,.7)}
  @media(max-width:420px){
    .card{padding:40px 22px 34px;border-radius:24px}
    h1{font-size:25px}
    .avatar{width:88px;height:88px}
  }
</style>
</head>
